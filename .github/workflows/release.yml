name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish artifacts for (for example v0.1.1)
        required: true
        type: string
      artifacts:
        description: Artifact group to publish
        required: true
        type: choice
        options:
          - all
          - images
          - plugin
        default: all

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check unified release version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const releaseTag = process.env.RELEASE_TAG
          const tagMatch = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(releaseTag)
          if (!tagMatch || process.env.RELEASE_PRERELEASE === 'true') {
            console.error('Only stable releases using the vX.Y.Z tag format are supported.')
            process.exit(1)
          }
          const releaseVersion = tagMatch[1]
          const packageFiles = [
            'package.json',
            'apps/package.json',
            'apps/server/package.json',
            'apps/web/package.json',
            'apps/admin/package.json',
            'packages/client/package.json',
            'packages/shared/package.json',
            'plugins/dsh/package.json',
          ]
          const mismatches = packageFiles
            .map((file) => ({ file, version: JSON.parse(fs.readFileSync(file, 'utf8')).version }))
            .filter(({ version }) => version !== releaseVersion)
          if (mismatches.length) {
            console.error(`Release tag v${releaseVersion} does not match package versions:`)
            for (const { file, version } of mismatches) console.error(`- ${file}: ${version}`)
            process.exit(1)
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const changelogHeading = new RegExp(`^## \\[${releaseVersion}\\] - \\d{4}-\\d{2}-\\d{2}$`, 'm')
          if (!changelogHeading.test(changelog)) {
            console.error(`CHANGELOG.md must contain a dated section for ${releaseVersion}.`)
            process.exit(1)
          }
          console.log(`All package versions match release tag v${releaseVersion}.`)
          NODE

  publish-images:
    if: github.event_name == 'release' || inputs.artifacts == 'all' || inputs.artifacts == 'images'
    runs-on: ubuntu-latest
    needs: validate-release-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Normalize image namespaces
        id: image-names
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_username=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.ghcr_owner }}/dsh-yutang-server:${{ env.RELEASE_TAG }}
            ghcr.io/${{ steps.image-names.outputs.ghcr_owner }}/dsh-yutang-server:latest
            ${{ steps.image-names.outputs.dockerhub_username }}/dsh-yutang-server:${{ env.RELEASE_TAG }}
            ${{ steps.image-names.outputs.dockerhub_username }}/dsh-yutang-server:latest
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.ghcr_owner }}/dsh-yutang-web:${{ env.RELEASE_TAG }}
            ghcr.io/${{ steps.image-names.outputs.ghcr_owner }}/dsh-yutang-web:latest
            ${{ steps.image-names.outputs.dockerhub_username }}/dsh-yutang-web:${{ env.RELEASE_TAG }}
            ${{ steps.image-names.outputs.dockerhub_username }}/dsh-yutang-web:latest

  publish-plugin:
    if: github.event_name == 'release' || inputs.artifacts == 'all' || inputs.artifacts == 'plugin'
    runs-on: ubuntu-latest
    needs: validate-release-version
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Set up npm Trusted Publishing support
        run: npm install --global 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dsh-im/shared build
      - run: pnpm --filter @dsh-im/client build
      - run: pnpm --filter dsh-yutang check
      - name: Publish dsh-yutang to npm
        working-directory: plugins/dsh
        run: npm publish --access public
