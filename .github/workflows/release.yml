name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-server:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-server:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-server:latest
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-web:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-web:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-web:latest

  publish-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dsh-yutang check
      - name: Publish dsh-yutang to npm
        working-directory: plugins/dsh
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
