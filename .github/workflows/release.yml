name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check unified release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const releaseTag = process.env.RELEASE_TAG
          const tagMatch = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(releaseTag)
          if (!tagMatch || process.env.RELEASE_PRERELEASE === 'true') {
            console.error('Only stable releases using the vX.Y.Z tag format are supported.')
            process.exit(1)
          }
          const releaseVersion = tagMatch[1]
          const packageFiles = [
            'package.json',
            'apps/package.json',
            'apps/server/package.json',
            'apps/web/package.json',
            'apps/admin/package.json',
            'packages/client/package.json',
            'packages/shared/package.json',
            'plugins/dsh/package.json',
          ]
          const mismatches = packageFiles
            .map((file) => ({ file, version: JSON.parse(fs.readFileSync(file, 'utf8')).version }))
            .filter(({ version }) => version !== releaseVersion)
          if (mismatches.length) {
            console.error(`Release tag v${releaseVersion} does not match package versions:`)
            for (const { file, version } of mismatches) console.error(`- ${file}: ${version}`)
            process.exit(1)
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const changelogHeading = new RegExp(`^## \\[${releaseVersion}\\] - \\d{4}-\\d{2}-\\d{2}$`, 'm')
          if (!changelogHeading.test(changelog)) {
            console.error(`CHANGELOG.md must contain a dated section for ${releaseVersion}.`)
            process.exit(1)
          }
          console.log(`All package versions match release tag v${releaseVersion}.`)
          NODE

  publish-images:
    runs-on: ubuntu-latest
    needs: validate-release-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-server:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-server:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-server:latest
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-web:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/dsh-yutang-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-web:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-yutang-web:latest

  publish-plugin:
    runs-on: ubuntu-latest
    needs: validate-release-version
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dsh-yutang check
      - name: Publish dsh-yutang to npm
        working-directory: plugins/dsh
        # The repository is currently private, so npm provenance cannot be generated yet.
        # Trusted Publishing will generate provenance automatically once the package and
        # public repository are configured for this workflow.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
