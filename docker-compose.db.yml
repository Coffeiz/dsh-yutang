services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-yutang}
      POSTGRES_USER: ${DB_USER:-yutang}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - yutang_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SSL_MODE: disable
  api:
    environment:
      DB_SSL_MODE: disable
volumes:
  yutang_postgres:
